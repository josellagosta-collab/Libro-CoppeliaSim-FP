<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <style>
      .title{font-family:Segoe UI,Arial,sans-serif;font-size:44px;font-weight:900;fill:#0D47A1}
      .subtitle{font-family:Segoe UI,Arial,sans-serif;font-size:25px;font-weight:600;fill:#37474F}
      .label{font-family:Segoe UI,Arial,sans-serif;font-size:25px;font-weight:800;fill:#263238}
      .small{font-family:Segoe UI,Arial,sans-serif;font-size:22px;font-weight:600;fill:#455A64}
      .panel{fill:#FFFFFF;stroke:#D6DCE5;stroke-width:4}
      .sensor{fill:#263238;stroke:#111111;stroke-width:4}
      .robot{fill:#D84343;stroke:#263238;stroke-width:4}
      .cone{fill:#BBDEFB;stroke:#1565C0;stroke-width:4;opacity:.55}
      .cone-line{stroke:#1565C0;stroke-width:4;stroke-dasharray:10 8}
      .obstacle{fill:#F5C242;stroke:#263238;stroke-width:4}
      .distance{stroke:#E53935;stroke-width:6;stroke-linecap:round;stroke-dasharray:14 10}
      .arrow{stroke:#1565C0;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .note{fill:#F5F9FF;stroke:#D6DCE5;stroke-width:3}
    </style>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1565C0"/>
    </marker>
    <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E53935"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="35" y="35" width="1530" height="880" rx="30" class="panel" filter="url(#shadow)"/>
  <text x="75" y="110" class="title">Volumen de detección de un sensor de proximidad</text>
  <text x="75" y="152" class="subtitle">El sensor solo detecta objetos situados dentro de su zona de alcance.</text>

  <g transform="translate(150,235)">
    <rect x="0" y="0" width="1300" height="510" rx="24" fill="#FAFCFF" stroke="#D6DCE5" stroke-width="3"/>
    <g transform="translate(170,255)">
      <rect x="-80" y="-95" width="160" height="190" rx="36" class="robot"/>
      <rect x="-95" y="-118" width="190" height="42" rx="20" fill="#263238"/>
      <circle cx="-50" cy="-78" r="14" fill="#F5C242" stroke="#263238" stroke-width="3"/>
      <circle cx="0" cy="-80" r="14" fill="#F5C242" stroke="#263238" stroke-width="3"/>
      <circle cx="50" cy="-78" r="14" fill="#F5C242" stroke="#263238" stroke-width="3"/>
      <rect x="-28" y="-130" width="56" height="38" rx="8" class="sensor"/>
      <text x="-95" y="145" class="label">Pioneer P3DX</text>
    </g>

    <path d="M320 125 L1070 25 A760 760 0 0 1 1070 485 Z" class="cone"/>
    <line x1="320" y1="125" x2="1070" y2="25" class="cone-line"/>
    <line x1="320" y1="125" x2="1070" y2="485" class="cone-line"/>
    <path d="M320 125 H1020" class="arrow" marker-end="url(#arrowBlue)"/>
    <text x="610" y="110" class="label" fill="#1565C0">Volumen de detección</text>

    <g transform="translate(950,255)">
      <rect x="-55" y="-55" width="110" height="110" rx="14" class="obstacle"/>
      <text x="-72" y="92" class="label">Obstáculo</text>
    </g>

    <line x1="320" y1="255" x2="895" y2="255" class="distance" marker-end="url(#arrowRed)"/>
    <text x="520" y="235" class="label" fill="#E53935">Distancia medida</text>

    <g transform="translate(1105,115)" opacity=".55">
      <rect x="-45" y="-45" width="90" height="90" rx="12" fill="#ECEFF1" stroke="#607D8B" stroke-width="4"/>
      <text x="-100" y="-65" class="small">Fuera del volumen</text>
      <text x="-65" y="-38" class="small">no se detecta</text>
    </g>
  </g>

  <rect x="95" y="790" width="1410" height="82" rx="18" class="note"/>
  <text x="130" y="825" class="label">Idea clave</text>
  <text x="130" y="858" class="small">Un sensor de proximidad no ve toda la escena: solo informa de objetos situados dentro de su volumen de detección y dentro de su alcance máximo.</text>

  <text x="80" y="910" class="small">Figura 8.4. Volumen de detección de un sensor de proximidad.</text>
</svg>