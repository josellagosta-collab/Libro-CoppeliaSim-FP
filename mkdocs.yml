site_name: CoppeliaSim 4.10 con Python
site_description: Manual de Robótica y Simulación para Formación Profesional
site_author: José Aguilera

theme:
  name: material
  language: es
  # custom_dir: overrides
  logo: assets/logos/logo.svg
  favicon: assets/logos/favicon.png
  features:
    - navigation.footer
    - navigation.tabs
    - navigation.top
    - navigation.expand
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - content.code.annotate

  font:
    text: Roboto
    code: JetBrains Mono

  palette:
    - scheme: default
      primary: blue
      accent: indigo
    - scheme: slate
      primary: blue
      accent: indigo

extra_css:
  - assets/css/coppeliasim-fp.css

extra_javascript:
  - assets/js/coppeliasim-fp.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2-4
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

plugins:
  - search
  - mermaid2
  - fp_book
  - minify:
      minify_html: true

nav:
  - Inicio: index.md
  - Prólogo: prologo.md
  - Introducción: introduccion.md

  - Parte I. Fundamentos:
      - Presentación: parte1/index.md
      - "Capítulo 1. ¿Por qué aprender robótica mediante simulación?": parte1/capitulo01.md
      - "Capítulo 2. Instalación y configuración inicial": parte1/capitulo02.md
      - "Capítulo 3. Conociendo la interfaz de CoppeliaSim": parte1/capitulo03.md
      - "Capítulo 4. Creando nuestra primera simulación": parte1/capitulo04.md
      - "Capítulo 5. Manipulación de objetos y sistemas de coordenadas": parte1/capitulo05.md
      - "Capítulo 6. Primera conexión entre Python y CoppeliaSim": parte1/capitulo06.md
  
  - Parte II. Robótica móvil:
      - Presentación: parte2/index.md
      - "Capítulo 7. Primer contacto con el Pioneer P3DX": parte2/capitulo07.md
      - "Capítulo 8. Sensores en robots móviles": parte2/capitulo08.md
      - "Capítulo 9. Control del movimiento del Pioneer P3DX": parte2/capitulo09.md
      - "Capítulo 10. Navegación autónoma mediante sensores": parte2/capitulo10.md
      - "Capítulo 11. Programación estructurada del Pioneer P3DX": parte2/capitulo11.md

  - Parte III. Visión artificial:
      - Presentación: parte3/index.md
      - "Capítulo 12. Visión artificial con CoppeliaSim": parte3/capitulo12.md
      - "Capítulo 13. Procesamiento básico de imágenes": parte3/capitulo13.md
      - "Capítulo 14. Detección y clasificación de objetos": parte3/capitulo14.md
      - "Capítulo 15. Seguimiento visual de objetos": parte3/capitulo15.md
      - "Capítulo 16. Proyecto final de percepción": parte3/capitulo16.md
    
  - Parte IV. Robótica Industrial:

      - Presentación: parte4/index.md
      - "Capítulo 17. Introducción a la robótica industrial": parte4/capitulo17.md
      - "Capítulo 18. Control de articulaciones": parte4/capitulo18.md
      - "Capítulo 19. Cinemática directa e inversa": parte4/capitulo19.md
      - "Capítulo 20. Manipulación de objetos": parte4/capitulo20.md
      - "Capítulo 21. Proyecto industrial completo": parte4/capitulo21.md

  - Parte V. Integración de sistemas:
      - Presentación: parte5/index.md
      - "Capítulo 22. Comunicación entre CoppeliaSim y aplicaciones externas": parte5/capitulo22.md
      - "Capítulo 23. Integración con ROS 2": parte5/capitulo23.md
      - "Capítulo 24. Comunicación industrial": parte5/capitulo24.md
      - "Capítulo 25. Gemelo digital e Industria 4.0": parte5/capitulo25.md
      - "Capítulo 26. Proyecto industrial conectado": parte5/capitulo26.md


  - Parte VI. Proyectos:
      - Presentación: parte6/index.md
      - "Capítulo 27. Diseño de una célula robotizada": parte6/capitulo27.md
      - "Capítulo 28. Sistema automático de clasificación": parte6/capitulo28.md
      - "Capítulo 29. Integración de visión artificial": parte6/capitulo29.md
      - "Capítulo 30. Proyecto final de Industria 4.0": parte6/capitulo30.md
      
  