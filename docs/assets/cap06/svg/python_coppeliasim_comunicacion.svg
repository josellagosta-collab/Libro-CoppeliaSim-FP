<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <style>
      .title{font-family:Segoe UI,Arial,sans-serif;font-size:44px;font-weight:900;fill:#0D47A1}
      .subtitle{font-family:Segoe UI,Arial,sans-serif;font-size:25px;font-weight:600;fill:#37474F}
      .section{font-family:Segoe UI,Arial,sans-serif;font-size:30px;font-weight:900;fill:#263238}
      .label{font-family:Segoe UI,Arial,sans-serif;font-size:24px;font-weight:800;fill:#263238}
      .small{font-family:Segoe UI,Arial,sans-serif;font-size:21px;font-weight:600;fill:#455A64}
      .code{font-family:Consolas,monospace;font-size:22px;font-weight:700;fill:#263238}
      .panel{fill:#FFFFFF;stroke:#D6DCE5;stroke-width:4}
      .python-panel{fill:#E8F5E9;stroke:#43A047;stroke-width:4}
      .coppelia-panel{fill:#E3F2FD;stroke:#1565C0;stroke-width:4}
      .zmq-panel{fill:#FFF8E1;stroke:#F5C242;stroke-width:4}
      .line{stroke:#90A4AE;stroke-width:4;stroke-linecap:round}
      .arrow-blue{stroke:#1565C0;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .arrow-green{stroke:#43A047;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .arrow-yellow{stroke:#F9A825;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .dark{fill:#263238}
      .green{fill:#43A047}
      .blue{fill:#1565C0}
      .yellow{fill:#F5C242}
      .red{fill:#D84343}
      .grey{fill:#ECEFF1}
    </style>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1565C0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#43A047"/>
    </marker>
    <marker id="arrowYellow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F9A825"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="35" y="35" width="1530" height="880" rx="30" class="panel" filter="url(#shadow)"/>
  <text x="75" y="110" class="title">Comunicación entre Python y CoppeliaSim</text>
  <text x="75" y="152" class="subtitle">La API remota ZeroMQ permite que un programa externo controle el simulador mediante mensajes.</text>

  <!-- Python side -->
  <rect x="100" y="250" width="430" height="360" rx="28" class="python-panel"/>
  <text x="140" y="310" class="section">Programa Python</text>
  <text x="140" y="348" class="small">Código escrito por el usuario</text>

  <g transform="translate(215,395)">
    <path class="green" d="M0 0h132c36 0 65 29 65 65v45H78c-44 0-80 36-80 80v56h-18c-36 0-65-29-65-65V65C-85 29-56 0-20 0z"/>
    <path class="yellow" d="M197 246H65c-36 0-65-29-65-65v-45h120c44 0 80-36 80-80V0h18c36 0 65 29 65 65v116c0 36-29 65-65 65z"/>
    <circle fill="#fff" cx="38" cy="43" r="12"/>
    <circle fill="#fff" cx="160" cy="203" r="12"/>
  </g>

  <rect x="135" y="515" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="3"/>
  <text x="160" y="552" class="code">RemoteAPIClient()</text>

  <!-- ZMQ bridge -->
  <rect x="585" y="315" width="430" height="230" rx="28" class="zmq-panel"/>
  <text x="650" y="372" class="section">ZeroMQ Remote API</text>
  <text x="650" y="410" class="small">Canal de comunicación</text>

  <g transform="translate(706,455)">
    <circle cx="0" cy="0" r="24" class="yellow"/>
    <circle cx="90" cy="0" r="24" class="yellow"/>
    <circle cx="180" cy="0" r="24" class="yellow"/>
    <path d="M24 0h42M114 0h42" class="line"/>
  </g>

  <text x="650" y="510" class="small">Envía peticiones y recibe respuestas.</text>

  <!-- CoppeliaSim side -->
  <rect x="1070" y="250" width="430" height="360" rx="28" class="coppelia-panel"/>
  <text x="1110" y="310" class="section">CoppeliaSim</text>
  <text x="1110" y="348" class="small">Simulador robótico</text>

  <g transform="translate(1195,390)">
    <rect x="0" y="0" width="210" height="150" rx="22" fill="#263238"/>
    <rect x="15" y="18" width="180" height="100" rx="10" fill="#E3F2FD"/>
    <line x1="32" y1="88" x2="175" y2="50" stroke="#CFD8DC" stroke-width="3"/>
    <line x1="45" y1="103" x2="188" y2="65" stroke="#CFD8DC" stroke-width="3"/>
    <rect x="78" y="60" width="58" height="35" rx="10" class="red"/>
    <circle cx="92" cy="100" r="10" class="dark"/>
    <circle cx="122" cy="100" r="10" class="dark"/>
    <rect x="90" y="41" width="36" height="22" rx="8" class="green"/>
  </g>

  <rect x="1105" y="515" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#90CAF9" stroke-width="3"/>
  <text x="1130" y="552" class="code">sim.startSimulation()</text>

  <!-- Arrows -->
  <path d="M530 400 H585" class="arrow-green" marker-end="url(#arrowGreen)"/>
  <path d="M1015 400 H1070" class="arrow-blue" marker-end="url(#arrowBlue)"/>

  <path d="M1070 500 H1015" class="arrow-yellow" marker-end="url(#arrowYellow)"/>
  <path d="M585 500 H530" class="arrow-yellow" marker-end="url(#arrowYellow)"/>

  <text x="535" y="370" class="label">Petición</text>
  <text x="1025" y="370" class="label">Acción</text>
  <text x="1020" y="545" class="label">Respuesta</text>
  <text x="535" y="545" class="label">Resultado</text>

  <!-- Bottom flow -->
  <rect x="95" y="725" width="1410" height="105" rx="18" fill="#F5F9FF" stroke="#D6DCE5" stroke-width="3"/>
  <text x="130" y="770" class="label">Flujo básico</text>
  <text x="130" y="805" class="small">Python envía una orden → ZeroMQ la transporta → CoppeliaSim ejecuta la acción → Python recibe la respuesta.</text>

  <text x="80" y="900" class="small">Figura 6.1. Comunicación entre Python y CoppeliaSim mediante la API remota ZeroMQ.</text>
</svg>