<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <style>
      .title{font-family:Segoe UI,Arial,sans-serif;font-size:44px;font-weight:900;fill:#0D47A1}
      .subtitle{font-family:Segoe UI,Arial,sans-serif;font-size:25px;font-weight:600;fill:#37474F}
      .section{font-family:Segoe UI,Arial,sans-serif;font-size:29px;font-weight:900;fill:#263238}
      .label{font-family:Segoe UI,Arial,sans-serif;font-size:24px;font-weight:800;fill:#263238}
      .small{font-family:Segoe UI,Arial,sans-serif;font-size:21px;font-weight:600;fill:#455A64}
      .code{font-family:Consolas,monospace;font-size:23px;font-weight:700;fill:#263238}
      .panel{fill:#FFFFFF;stroke:#D6DCE5;stroke-width:4}
      .function{fill:#E3F2FD;stroke:#1565C0;stroke-width:4}
      .main{fill:#E8F5E9;stroke:#43A047;stroke-width:4}
      .extra{fill:#FFF8E1;stroke:#F5C242;stroke-width:4}
      .arrow{stroke:#1565C0;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .note{fill:#F5F9FF;stroke:#D6DCE5;stroke-width:3}
      .badge{fill:#1565C0}
    </style>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1565C0"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="35" y="35" width="1530" height="880" rx="30" class="panel" filter="url(#shadow)"/>
  <text x="75" y="110" class="title">Valores devueltos por readProximitySensor()</text>
  <text x="75" y="152" class="subtitle">En CoppeliaSim EDU 4.10 la lectura de un sensor de proximidad devuelve cinco valores.</text>

  <rect x="450" y="210" width="700" height="90" rx="22" class="function"/>
  <text x="505" y="266" class="code">sim.readProximitySensor(sensor)</text>

  <path d="M800 300 V350" class="arrow" marker-end="url(#arrowBlue)"/>

  <rect x="100" y="380" width="650" height="120" rx="22" class="main"/>
  <circle cx="145" cy="420" r="24" class="badge"/>
  <text x="137" y="429" class="label" fill="#FFFFFF">1</text>
  <text x="185" y="420" class="section">resultado</text>
  <text x="185" y="458" class="small">Indica si el sensor ha detectado un objeto.</text>
  <text x="520" y="455" class="code">True / False</text>

  <rect x="850" y="380" width="650" height="120" rx="22" class="main"/>
  <circle cx="895" cy="420" r="24" class="badge"/>
  <text x="887" y="429" class="label" fill="#FFFFFF">2</text>
  <text x="935" y="420" class="section">distancia</text>
  <text x="935" y="458" class="small">Distancia desde el sensor hasta el punto detectado.</text>
  <text x="1270" y="455" class="code">0.423 m</text>

  <rect x="100" y="540" width="430" height="140" rx="22" class="extra"/>
  <circle cx="145" cy="580" r="24" fill="#F5C242"/>
  <text x="137" y="589" class="label">3</text>
  <text x="185" y="580" class="section">punto</text>
  <text x="185" y="618" class="small">Coordenadas del punto de detección.</text>
  <text x="185" y="652" class="code">[x, y, z]</text>

  <rect x="585" y="540" width="430" height="140" rx="22" class="extra"/>
  <circle cx="630" cy="580" r="24" fill="#F5C242"/>
  <text x="622" y="589" class="label">4</text>
  <text x="670" y="580" class="section">objeto</text>
  <text x="670" y="618" class="small">Identificador del objeto detectado.</text>
  <text x="670" y="652" class="code">handle</text>

  <rect x="1070" y="540" width="430" height="140" rx="22" class="extra"/>
  <circle cx="1115" cy="580" r="24" fill="#F5C242"/>
  <text x="1107" y="589" class="label">5</text>
  <text x="1155" y="580" class="section">normal</text>
  <text x="1155" y="618" class="small">Vector normal de la superficie detectada.</text>
  <text x="1155" y="652" class="code">[nx, ny, nz]</text>

  <rect x="95" y="735" width="1410" height="105" rx="18" class="note"/>
  <text x="130" y="778" class="label">En este capítulo</text>
  <text x="130" y="812" class="small">Para detectar obstáculos solo necesitamos los dos primeros valores: resultado y distancia.</text>
  <text x="910" y="812" class="code">resultado, distancia, _, _, _ = sim.readProximitySensor(sensor)</text>

  <text x="80" y="900" class="small">Figura 8.9. Valores devueltos por readProximitySensor() en CoppeliaSim EDU 4.10.</text>
</svg>