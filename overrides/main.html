{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="manifest" href="{{ 'manifest.webmanifest' | url }}">
  <meta name="theme-color" content="#0d47a1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CoppeliaSim FP">
  <link rel="apple-touch-icon" href="{{ 'assets/icons/icon-192.png' | url }}">
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("{{ 'service-worker.js' | url }}");
      });
    }
  </script>
{% endblock %}
